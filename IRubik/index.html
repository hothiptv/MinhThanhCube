<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Minh Thanh Cube IRubik</title>
<style>
html,body{margin:0;height:100%;background:#111214;color:#eceef1;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{display:flex;flex-direction:column;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);transition:background-color .4s}
#f{flex:1;min-height:0;width:100%;border:0;opacity:0;transition:opacity .35s}#f.on{opacity:1}
#msg{position:fixed;inset:0;display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center}
#msg[hidden]{display:none}
.box{max-width:360px;display:grid;gap:12px;justify-items:center}
.ring{width:44px;height:44px;border-radius:50%;border:5px solid #34373e;border-top-color:#6b9bff;animation:s .85s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
.err .ring{display:none}#t{font-weight:700}#d{color:#9aa1ad;font-size:14px;white-space:pre-line}
button{font:inherit;min-height:44px;padding:0 18px;border-radius:10px;border:0;background:#6b9bff;color:#fff;font-weight:600;display:none}.err button{display:block}
</style>
</head>
<body>
<iframe id="f" title="Minh Thanh Cube IRubik" allow="clipboard-read; clipboard-write"></iframe>
<div id="msg"><div class="box" id="bx"><div class="ring"></div><div id="t">Đang tải…</div><div id="d"></div><button id="r">Thử lại</button></div></div>
<script>
const $=id=>document.getElementById(id),f=$("f"),KEY="mtc.run";let V={E:[],run:""},curUrl="";
function parseVision(t){const E=[];let run="";String(t).split(/\r?\n/).forEach(l=>{l=l.trim();if(!l||l[0]=="#")return;let m;
 if(m=l.match(/^run\s*:\s*(.+)$/i)){run=m[1].trim();return}
 if(m=l.match(/^vision\s*:\s*(.+)$/i)){let r=m[1].trim(),link=false;const lm=r.match(/^link\s*:\s*(.+)$/i);if(lm){link=true;r=lm[1].trim()}
  const i=link?r.lastIndexOf(","):r.indexOf(",");if(i<0)return;E.push({url:r.slice(0,i).trim(),name:r.slice(i+1).trim(),link})}});return {E,run}}
const abs=u=>{try{return new URL(u,location.href).href}catch(e){return u}};
const lc=s=>String(s).toLowerCase();
function show(t,d,err){$("bx").classList.toggle("err",!!err);$("t").textContent=t;$("d").textContent=d||"";$("msg").hidden=false}
function go(url){curUrl=abs(url);try{sessionStorage.setItem(KEY,curUrl)}catch(e){}f.classList.remove("on");show("Đang mở phiên bản…","");f.src=curUrl}
f.addEventListener("load",()=>{if(!f.src||f.src==="about:blank")return;$("msg").hidden=true;f.classList.add("on")});
function chooseRun(){let s=null;try{s=sessionStorage.getItem(KEY)}catch(e){}
 if(s&&V.E.some(x=>abs(x.url)==s))return s;
 if(!V.run)return null;
 const e=V.E.find(x=>lc(x.url)==lc(V.run)||lc(x.name)==lc(V.run));return e?e.url:V.run}
async function boot(){show("Đang đọc vision.txt…","");
 try{const r=await fetch("vision.txt",{cache:"no-store"});if(!r.ok)throw 0;V=parseVision(await r.text())}
 catch(e){return show("Không đọc được vision.txt","Hãy mở index.html qua server (localhost) và đặt vision.txt cùng thư mục.",1)}
 const u=chooseRun();if(!u)return show("Chưa có lệnh run:","Thêm dòng  run: <tên file>  vào vision.txt.",1);
 go(u)}
addEventListener("message",e=>{if(e.source!==f.contentWindow)return;const d=e.data||{};
 if(d.t=="mtc-get")e.source.postMessage({t:"mtc-list",E:V.E.map(x=>({...x,abs:x.link?x.url:abs(x.url)})),run:curUrl},"*");
 else if(d.t=="mtc-run"&&typeof d.url=="string")go(d.url);
 else if(d.t=="mtc-bg"&&typeof d.c=="string")document.body.style.backgroundColor=d.c});
$("r").onclick=boot;boot();
</script>
</body>
</html>
